name: CI

on:
  pull_request:
    branches: [main, staging, Dev]
  push:
    branches: [main, Dev]

jobs:
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Brakeman — Rails static security analysis
        run: bundle exec brakeman --no-pager

      - name: Bundle Audit — Ruby gem CVE check
        run: bundle exec bundle-audit check --update

      - name: npm audit — JS dependency CVE check
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm audit --omit=dev || true

  lint:
    name: Lint & style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop -f github

  test:
    name: RSpec (${{ matrix.type }})
    runs-on: ubuntu-latest
    needs: [security, lint]

    strategy:
      fail-fast: false
      matrix:
        type: [models, requests, features]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git libpq-dev libyaml-dev node-gyp pkg-config python3 google-chrome-stable

      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build JS & CSS assets
        run: npm run build

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run RSpec — ${{ matrix.type }}
        run: bundle exec rspec spec/${{ matrix.type }} --format documentation --tag ~slow

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ matrix.type }}
          path: tmp/screenshots
          if-no-files-found: ignore
